<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf8f5" />
    <meta name="description" content="Your family's command center for calendar, lists, chores, and meals." />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />

    <!-- iOS PWA -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FamilyHub" />
    <title>FamilyHub - Family Calendar & Organizer</title>
  </head>
  <body>
    <script>
      // Paints the look this device chose before the app loads, so a dark wall
      // never flashes cream on reload. Mirrors applyThemeToDocument in src/lib/themes.ts.
      (function () {
        try {
          var raw = localStorage.getItem("family-hub-theme");
          if (!raw) return;
          var state = (JSON.parse(raw) || {}).state || {};
          var resolved = state.resolved || {};
          var root = document.documentElement;
          if (!resolved.theme) return;
          root.setAttribute("data-theme", resolved.theme);
          if (resolved.dark) root.classList.add("dark");
          var packs = state.appliedPacks || {};
          var pack = state.activePackId ? packs[state.activePackId] : null;
          if (resolved.theme === "pack" && pack && pack.tokens) {
            for (var name in pack.tokens) {
              var value = String(pack.tokens[name]);
              if (/^--[a-z0-9-]+$/.test(name) && !/[;{}<>]|url\(|expression\(|javascript:/i.test(value)) {
                root.style.setProperty(name, value);
              }
            }
            for (var key in pack.images || {}) {
              var url = String(pack.images[key]);
              if (/^[a-z0-9-]+$/.test(key) && /^data:image\/(png|jpe?g|webp|gif|svg\+xml);base64,[A-Za-z0-9+/=]+$/.test(url)) {
                root.style.setProperty("--theme-image-" + key, 'url("' + url + '")');
              }
            }
          }
        } catch (e) {
          /* a broken preference must never block the app */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
