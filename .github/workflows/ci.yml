name: CI
permissions:
  contents: read
  statuses: write
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run lint
      - run: npm run test:coverage
      # This fork publishes no GitHub releases (release-please was removed so the
      # Gitea push mirror cannot clobber its branches), so the e2e run uses the
      # backend image our own CI pushes on every main build.
      - name: Point e2e at this fork's backend image
        run: echo "BE_IMAGE_TAG=latest" >> "$GITHUB_ENV"
      - name: Start backend container
        run: docker compose -f docker-compose.e2e.yml up -d --wait
      - name: Run E2E tests (real backend)
        run: npm run test:e2e
      - name: Stop backend container
        if: always() && env.BE_IMAGE_TAG != ''
        run: docker compose -f docker-compose.e2e.yml down
      - run: npm run build
      - name: Check bundle size budget
        run: npm run check:bundle
      - name: Collect Lighthouse reports
        run: npx lhci collect
      - name: Assert Lighthouse thresholds
        run: npx lhci assert
      - name: Upload Lighthouse to temporary storage
        run: npx lhci upload
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 90

  publish-docker:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Named for what it is rather than after the repo (FamilyHub), so the
          # compose stack reads family-hub-api next to family-hub-web.
          images: ghcr.io/${{ github.repository_owner }}/family-hub-web
          tags: |
            type=raw,value=latest
            type=sha,prefix=
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
